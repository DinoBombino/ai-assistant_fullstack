# docker-compose.yml
# version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: ai-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./server/database:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres 
      -c log_connections=on 
      -c log_disconnections=on 
      -c log_statement=all 
      -c password_encryption=scram-sha-256

  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: ai-assistant-surrealdb
    restart: unless-stopped
    user: "0:0"
    command: start --log info --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} rocksdb:/data/surreal
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data

volumes:
  postgres_data:
  surrealdb_data:
